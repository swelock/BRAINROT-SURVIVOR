<!doctype html><meta charset="utf-8"><title>Locomotion v1.0.3 · development</title>
<style>body{margin:0;background:#203b2d;color:#e0ebc7;font:14px system-ui}header{padding:15px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}canvas{display:block;max-width:100%}output{padding:15px;display:block}</style>
<header><b>LOCOMOTION LAB · 5 × 8 × 6</b><label>Speed <input id="speed" type="range" min="0" max="650" value="210"></label><label><input id="dash" type="checkbox"> Dash</label><label><input id="attack" type="checkbox"> Attack</label><label><input id="spin" type="checkbox"> Spin / slam</label><button id="fallback">Toggle walk asset fallback</button></header><canvas width="1200" height="720"></canvas><output id="report"></output>
<script type="module">
import {assets} from '../js/systems/AssetManager.js';import {drawCharacter} from '../js/game/Renderer.js';import {updateLocomotion} from '../js/systems/LocomotionSystem.js';import {characters} from '../js/data/catalog.js';
await Promise.all([assets.preload(),assets.preloadMotion()]);const c=document.querySelector('canvas').getContext('2d'),names=['tung','shark','cup','croc','chaos'],dirs=['E','SE','S','SW','W','NW','N','NE'];const poses=names.map(id=>dirs.map((_,d)=>({character:characters.find(c=>c.id===id),lastX:Math.cos(d*Math.PI/4),lastY:Math.sin(d*Math.PI/4),passive:3,dashLeft:0})));let previous=performance.now(),backup;
document.querySelector('#fallback').onclick=()=>{if(backup){assets.motionImages=backup;backup=null;}else{backup=assets.motionImages;assets.motionImages=new Map();}};
function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;const speed=+document.querySelector('#speed').value,dash=document.querySelector('#dash').checked;c.fillStyle='#375440';c.fillRect(0,0,1200,720);c.font='14px system-ui';c.textAlign='center';c.fillStyle='#d9e8b9';dirs.forEach((d,i)=>c.fillText(d,160+i*138,25));
 names.forEach((id,row)=>{c.fillStyle='#d9e8b9';c.fillText(id,52,100+row*135);poses[row].forEach((p,d)=>{updateLocomotion(p,dt,p.lastX*speed*dt,p.lastY*speed*dt,dash);p.dashLeft=dash?.15:0;p.attackPose=document.querySelector('#attack').checked&&now%650<85?.085:0;p.attackAngle=d*Math.PI/4;p.specialTime=document.querySelector('#spin').checked?.5:0;drawCharacter(c,id,160+d*138,105+row*135,1.15,now/1000,1,false,p);});});document.querySelector('#report').textContent=`${speed}px/s · ${assets.motionImages.size} walk sheets · frames ${poses.map(row=>row[0].motion.frame).join(', ')} · ${dash?'dash pose':'distance-driven cycles'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
